<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="referrer" content="no-referrer" />
    <script>
      // OAuth Popup Response Handler
      if (window.location.hash.includes("access_token=") || window.location.hash.includes("error=")) {
        try {
          const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
          const accessToken = hashParams.get("access_token");
          const error = hashParams.get("error");
          if (accessToken) {
            try {
              localStorage.setItem("google_oauth_token", JSON.stringify({ accessToken, time: Date.now() }));
            } catch (_) {}
            if (window.opener) {
              window.opener.postMessage(
                { type: "GOOGLE_OAUTH_TOKEN", accessToken },
                window.location.origin
              );
            }
          } else if (error) {
            try {
              localStorage.setItem("google_oauth_error", JSON.stringify({ error, time: Date.now() }));
            } catch (_) {}
            if (window.opener) {
              window.opener.postMessage(
                { type: "GOOGLE_OAUTH_ERROR", error },
                window.location.origin
              );
            }
          }
          window.close();
        } catch (e) {
          console.error("Failed to post message to opener", e);
        }
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
